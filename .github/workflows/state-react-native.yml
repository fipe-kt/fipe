name: Fipe State React Native

on:
  pull_request:
    paths:
      - 'state/react-native/**'
      - '.github/workflows/state-react-native.yml'

permissions:
  contents: read

jobs:
  package:
    name: Test the installed npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: state/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
